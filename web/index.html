<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#101820" />
<title>SteadyUp</title>
<style>
  :root { color-scheme: dark; --bg: #101820; --card: #1b2a38; --ink: #ffffff; --soft: #bfd7ea; --blue: #5fa8d3; --good: #7bdc8f; --warn: #ffd166; --bad: #ffb4a2; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 20px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
  h1 { font-size: 36px; margin: 8px 0 4px; }
  .lead { color: var(--soft); margin: 4px 0 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 20px 16px; margin: 16px 0; }
  label.sr { position: absolute; left: -9999px; }
  input { font: 36px ui-monospace, monospace; letter-spacing: 8px; width: 100%; padding: 14px 8px; text-align: center; border-radius: 14px; border: 3px solid var(--blue); background: #fff; color: #101820; }
  input:focus-visible, button:focus-visible { outline: 4px solid var(--warn); outline-offset: 3px; }
  button { font: 700 24px system-ui, sans-serif; width: 100%; min-height: 60px; margin-top: 16px; padding: 14px; border-radius: 14px; border: 0; background: var(--blue); color: #101820; cursor: pointer; }
  .tip { color: var(--soft); font-size: 18px; margin: 16px 0 0; }
  #status { margin: 16px 0 0; font-size: 22px; min-height: 2em; }
  #status.ok { color: var(--good); font-weight: 700; }
  #status.bad { color: var(--bad); }
  .cam { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; background: #000; }
  .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .cam svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; pointer-events: none; }
  #seen { font-size: 22px; margin: 12px 0 0; }
  #count { font-size: 96px; line-height: 1.1; margin: 0; color: var(--good); font-weight: 700; }
  .hidden { display: none; }
</style>
</head>
<body>
<main id="app">
  <h1>SteadyUp</h1>
  <section id="join" class="card">
    <p class="lead">Type the 6 numbers from your TV.</p>
    <label class="sr" for="code">Number from your TV</label>
    <input id="code" inputmode="numeric" autocomplete="off" maxlength="8" />
    <button id="joinBtn" type="button">Join</button>
    <p class="tip">Lean your phone on a shelf. Stand two steps back, so it can see all of you.</p>
  </section>
  <section id="live" class="hidden">
    <div class="cam">
      <video id="preview" playsinline muted aria-hidden="true"></video>
      <svg viewBox="0 0 400 300" aria-hidden="true" focusable="false"><g fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 8"><circle cx="200" cy="52" r="26"/><path d="M200 78v110M200 100l-52 48M200 100l52 48M200 188l-40 92M200 188l40 92"/></g></svg>
    </div>
    <p id="seen">Looking for you…</p>
    <p id="note" class="tip" role="status"></p>
    <p id="count" aria-label="Count">0</p>
  </section>
  <p id="status" role="status">Ready.</p>
</main>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
